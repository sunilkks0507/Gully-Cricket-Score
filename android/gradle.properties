org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation stores source paths RELATIVE to the project dir.
# When the project and the pub cache live on different Windows drives (project on
# D:, pub cache on C:\Users\...\Pub\Cache), that relativisation throws
# "different roots" and the build fails compiling plugin Kotlin sources
# (e.g. image_picker_android). Release builds don't benefit from incremental
# compilation anyway, so disable it.
kotlin.incremental=false
